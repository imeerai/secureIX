        <h1>SecurIX Real-Time URL Security and Phishing Detector</h1>
        <p>SecurIX is a browser-based website security scanner for developers, security teams, and site owners. Enter a public URL to inspect its security posture, transport protection, HTTP response headers, hosting technology, and technical SEO signals.</p>
        <p>The security audit checks HTTPS, TLS certificate details, HSTS, Content Security Policy, clickjacking protection, MIME sniffing controls, referrer privacy, permissions policy, cookies, CORS, DNS email protection, and common phishing indicators. It also checks for accidentally exposed sensitive files such as environment files, Git metadata, and backup archives.</p>
        <p>Alongside the security report, SecurIX identifies hosting providers, CDNs, frontend frameworks, backend platforms, and other technology signals. Its SEO audit reviews titles, descriptions, canonical URLs, robots directives, headings, structured data, social sharing metadata, sitemap availability, image alternatives, links, and Lighthouse performance metrics.</p>
        <p>SecurIX is designed to provide fast, practical findings without requiring an account. Results include clear pass, warning, and failure states with recommendations that help teams improve website security, privacy, resilience, discoverability, and performance.</p>
